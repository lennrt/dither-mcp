<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Dither studio sandbox proxy</title><style>html,body{margin:0;width:100%;height:100%}iframe{display:block;border:0;width:100%;height:100%}</style></head><body><script>
// This proxy runs on a separate loopback origin. The inner App has an opaque
// origin and no network, forms, popups, downloads or native filesystem access.
const hostOrigin = 'HOST_ORIGIN';
const hostWindow = window.parent;
let app;
window.addEventListener('message', (event) => {
  const message = event.data;
  if (message?.jsonrpc !== '2.0') return;
  if (event.source === hostWindow && event.origin === hostOrigin) {
    if (message.method === 'ui/notifications/sandbox-resource-ready') {
      if (app || typeof message.params?.html !== 'string') return;
      app = document.createElement('iframe');
      app.title = 'Dither studio'; app.setAttribute('sandbox', 'allow-scripts');
      const policy = "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'";
      const parsed = new DOMParser().parseFromString(message.params.html, 'text/html');
      const meta = parsed.createElement('meta'); meta.httpEquiv = 'Content-Security-Policy'; meta.content = policy; parsed.head.prepend(meta);
      app.srcdoc = '<!doctype html>' + parsed.documentElement.outerHTML;
      window.document.body.append(app);
    } else if (app && !String(message.method ?? '').startsWith('ui/notifications/sandbox-')) app.contentWindow.postMessage(message, '*');
  } else if (app && event.source === app.contentWindow && event.origin === 'null' && !String(message.method ?? '').startsWith('ui/notifications/sandbox-')) {
    hostWindow.postMessage(message, hostOrigin);
  }
});
hostWindow.postMessage({ jsonrpc: '2.0', method: 'ui/notifications/sandbox-proxy-ready', params: {} }, hostOrigin);
</script></body></html>
